name: Create builder Docker Image
run-name: Create builder Docker Image
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  create-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build x86_64
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cross-x86_64-unknown-linux-gnu-gpui:latest - < cross/Dockerfile.linux_x86_64
          docker push ghcr.io/${{ github.repository_owner }}/cross-x86_64-unknown-linux-gnu-gpui:latest
      - name: Build aarch64
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cross-aarch64-unknown-linux-gnu-gpui:latest - < cross/Dockerfile.linux_aarch64
          docker push ghcr.io/${{ github.repository_owner }}/cross-aarch64-unknown-linux-gnu-gpui:latest
      - name: Build armv7
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cross-armv7-unknown-linux-gnu-gpui:latest - < cross/Dockerfile.linux_armv7
          docker push ghcr.io/${{ github.repository_owner }}/cross-armv7-unknown-linux-gnu-gpui:latest
