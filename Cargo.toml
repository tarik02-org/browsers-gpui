[package]
name = "browsers"
version = "2026.8.2200"
authors = ["Madis Liias <madisliias@gmail.com>"]
edition = "2024"
description = "Browsers"
homepage = "https://github.com/tarik02-org/browsers-gpui"
repository = "https://github.com/tarik02-org/browsers-gpui"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]

# logging library
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "std", "time", "local-time"] }
tracing-appender = "0.2.3"

# Official remote
#rolling-file = "0.2.0"

# Chrono-less fork, so doesn't pull in old time crate 0.1
rolling-file = { git = "https://github.com/browsers-software/rolling-file-rs.git", branch = "browsers" }

dirs = "6.0.0"

toml = "1.0.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }

# GPU-accelerated UI and component library. gpui-component tracks Zed's
# unpublished GPUI APIs, so Cargo.lock pins both repositories.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "e12e39ca55051d02f0e2ae8a910a674905c722d6" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "e12e39ca55051d02f0e2ae8a910a674905c722d6" }

# Browser/profile icon decoding and cache generation.
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
flume = "0.12"

# parse urls
url = "2.5.7"

# parse url rules
globset = "0.4.18"

# Parse .ini files (e.g Firefox profiles.ini)
configparser = "3.1.0"

# Hash Firefox path with cityhash64, to map it to
# locked installation in profiles.ini
naive-cityhash = "0.2.0"

# To create lazy static variables
lazy_static = "1.5.0"

# Dark-light system theme detection
dark-light = "2.0.0"

# macOS Core Foundation bindings
# small selection of Core Foundation libs I happen to need
[target.'cfg(target_os = "macos")'.dependencies]
# for macos_native
objc2-foundation = "0.3.1"
objc2-app-kit = "0.3.1"
objc2 = "0.6.1"

# for mac_paths (to get unsandboxed_home_dir for mac)
libc = "0.2.154"

[target.'cfg(target_os = "linux")'.dependencies]
xdg-mime = "^0.4.0"
zbus = "5.19.0"

# to find application .desktop files
freedesktop-desktop-entry = "0.8.0"

# to find icon theme and icon;
freedesktop-icons = "0.4.0"

# Helps parsing commands that are in Exec field in .desktop files
shell-words = "1.1.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

winapi = { version = "0.3.9", features = [
    "minwindef",
    "ntdef",
    "shellapi",
    "windef",
    "wingdi",
    "winuser",
] }

# Helps parsing commands that are in windows registry for different apps
# Same as `shell-words` but for Windows, i.e supporting \ in paths
winsplit = "0.1"

# Replacement for fs::canonicalize, but returns normal path instead of the `\\?` prefixed path
dunce = "1.0.4"

[target.'cfg(target_os = "windows")'.build-dependencies]
# To embed .ico into .exe
# Requires rc.exe from the Windows SDK (or windres.exe and ar.exe from minGW64)
winres = "0.1.12"

# statically link vcruntime140.dll instead of requiring user to install the runtime
static_vcruntime = "3.0"

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/tarik02-org/zed", rev = "765f26b4414ed87dad9026cbdc34ad5188b02a15", version = "=0.2.2" }
gpui_linux = { git = "https://github.com/tarik02-org/zed", rev = "765f26b4414ed87dad9026cbdc34ad5188b02a15", version = "=0.1.0" }
gpui_macros = { git = "https://github.com/tarik02-org/zed", rev = "765f26b4414ed87dad9026cbdc34ad5188b02a15", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/tarik02-org/zed", rev = "765f26b4414ed87dad9026cbdc34ad5188b02a15", version = "=0.1.0" }

#[profile.dev]
#lto = true

[profile.release]
#opt-level = 'z'     # Optimize for size.
lto = true           # Enable Link Time Optimization
#codegen-units = 1   # Reduce number of codegen units to increase optimizations.
#panic = 'abort'     # Abort on panic

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

# Base image is ubuntu:24.04, see https://github.com/cross-rs/cross/blob/main/docker/Dockerfile.x86_64-unknown-linux-gnu
# Unfortunately https://github.com/cross-rs/cross/pull/591 is not yet in stable version,
# so update from main to specific version once released https://github.com/cross-rs/cross/pkgs/container/x86_64-unknown-linux-gnu/versions?filters%5Bversion_type%5D=tagged
# Additionally install some libraries we need
[package.metadata.cross.build.env]
passthrough = ["CARGO_PROFILE_RELEASE_LTO"]

[package.metadata.cross.target.x86_64-unknown-linux-gnu]
image = "ghcr.io/tarik02-org/cross-x86_64-unknown-linux-gnu-gpui:latest"

[package.metadata.cross.target.aarch64-unknown-linux-gnu]
image = "ghcr.io/tarik02-org/cross-aarch64-unknown-linux-gnu-gpui:latest"

[package.metadata.cross.target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/tarik02-org/cross-armv7-unknown-linux-gnu-gpui:latest"
